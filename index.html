<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>💰 Student Expense Tracker</h1>
            <p>Track your daily expenses easily</p>
        </header>

        <!-- Summary Cards -->
        <section class="summary">

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0</p>
            </div>

            <div class="card">
                <h3>Total Transactions</h3>
                <p id="totalTransactions">0</p>
            </div>

            <div class="card">
                <h3>Average Expense</h3>
                <p id="averageExpense">₹0</p>
            </div>

        </section>

        <!-- Add Expense -->
        <section class="expense-form">

            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="expenseTitle">Expense Name</label>
                    <input
                        type="text"
                        id="expenseTitle"
                        placeholder="e.g. Lunch"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="expenseAmount">Amount (₹)</label>
                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="e.g. 100"
                        min="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="expenseCategory">Category</label>

                    <select id="expenseCategory" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Room Rent">Room Rent</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expenseDate">Date</label>

                    <input
                        type="date"
                        id="expenseDate"
                        required
                    >
                </div>

                <button type="submit" class="add-btn">
                    Add Expense
                </button>

            </form>

        </section>

        <!-- Search and Filter -->
        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search expense..."
            >

            <select id="filterCategory">

                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Room Rent">Room Rent</option>
                <option value="Other">Other</option>

            </select>

        </section>

        <!-- Expense List -->
        <section class="expense-section">

            <h2>Expense History</h2>

            <div id="expenseList"></div>

            <p id="emptyMessage" class="empty-message">
                No expenses added yet.
            </p>

        </section>

    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">

        <div class="modal-content">

            <span id="closeModal" class="close">&times;</span>

            <h2>Edit Expense</h2>

            <form id="editForm">

                <input type="hidden" id="editId">

                <label>Expense Name</label>
                <input type="text" id="editTitle" required>

                <label>Amount (₹)</label>
                <input type="number" id="editAmount" min="1" required>

                <label>Category</label>

                <select id="editCategory" required>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <label>Date</label>
                <input type="date" id="editDate" required>

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
